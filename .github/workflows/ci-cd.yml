name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: oneverse
  IMAGE_NAME: isaiahim0214/colorize-neo-bible-oneverse

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run all tests
        run: ./gradlew test --no-daemon

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(grep -E '^version = "' build.gradle.kts | sed -E 's/^version = "([^"]+)".*/\1/')"

          if [ -z "$VERSION" ]; then
            echo "Could not extract project version from build.gradle.kts."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets are required."
            exit 1
          fi

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build and push Docker image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_SHA="$IMAGE_NAME:${GITHUB_SHA}"
          IMAGE_VERSION="$IMAGE_NAME:$VERSION"
          IMAGE_LATEST="$IMAGE_NAME:latest"

          docker build \
            --tag "$IMAGE_SHA" \
            --tag "$IMAGE_VERSION" \
            --tag "$IMAGE_LATEST" \
            .

          docker push "$IMAGE_SHA"
          docker push "$IMAGE_VERSION"
          docker push "$IMAGE_LATEST"

          echo "image_ref=$IMAGE_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    env:
      IMAGE_REF: ${{ needs.docker.outputs.image_ref || format('{0}:{1}', env.IMAGE_NAME, needs.docker.outputs.version) }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      APP_PORT: ${{ secrets.APP_PORT || '8080' }}

    steps:
      - name: Install OpenVPN and SSH clients
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openvpn openssh-client

      - name: Connect to internal network with OpenVPN
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$OPENVPN_CONFIG" ]; then
            echo "OPENVPN_CONFIG secret is required."
            exit 1
          fi

          printf '%s' "$OPENVPN_CONFIG" > client.ovpn
          chmod 600 client.ovpn

          if [ -n "$OPENVPN_USERNAME" ] && [ -n "$OPENVPN_PASSWORD" ]; then
            printf '%s\n%s\n' "$OPENVPN_USERNAME" "$OPENVPN_PASSWORD" > vpn-auth.txt
            chmod 600 vpn-auth.txt

            if grep -q '^auth-user-pass' client.ovpn; then
              sed -i 's|^auth-user-pass.*|auth-user-pass vpn-auth.txt|' client.ovpn
            else
              printf '\nauth-user-pass vpn-auth.txt\n' >> client.ovpn
            fi
          fi

          sudo openvpn \
            --config client.ovpn \
            --daemon \
            --writepid openvpn.pid \
            --log openvpn.log

          for _ in $(seq 1 30); do
            if sudo grep -q "Initialization Sequence Completed" openvpn.log; then
              echo "OpenVPN connected."
              exit 0
            fi

            if [ -f openvpn.pid ] && ! sudo kill -0 "$(sudo cat openvpn.pid)" 2>/dev/null; then
              echo "OpenVPN process stopped unexpectedly."
              sudo cat openvpn.log
              exit 1
            fi

            sleep 2
          done

          echo "OpenVPN connection timed out."
          sudo cat openvpn.log
          exit 1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SERVER_HOST, SERVER_USER, and SSH_PRIVATE_KEY secrets are required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi

          chmod 644 ~/.ssh/known_hosts

      - name: Create remote environment file
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret is required."
            exit 1
          fi

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p ~/oneverse"

          {
            printf 'GOOGLE_API_KEY=%s\n' "$GOOGLE_API_KEY"
            printf 'TZ=Asia/Seoul\n'
          } | ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cat > ~/oneverse/.env && chmod 600 ~/oneverse/.env"

      - name: Pull and run Docker container
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$IMAGE_REF" ]; then
            echo "IMAGE_REF is empty."
            exit 1
          fi

          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
              "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"
          fi

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "IMAGE_REF='$IMAGE_REF' APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' bash -s" <<'REMOTE'
          set -euo pipefail

          DEPLOY_DIR="$HOME/oneverse"

          docker pull "$IMAGE_REF"
          docker rm -f "$APP_NAME" 2>/dev/null || true
          docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --env-file "$DEPLOY_DIR/.env" \
            -p "$APP_PORT:8080" \
            "$IMAGE_REF"
          REMOTE

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "APP_NAME='$APP_NAME' APP_PORT='$APP_PORT' bash -s" <<'REMOTE'
          set -euo pipefail

          for _ in $(seq 1 30); do
            if command -v curl >/dev/null 2>&1; then
              if curl -fsS "http://127.0.0.1:${APP_PORT}/" >/dev/null; then
                echo "Deployment verified."
                exit 0
              fi
            else
              if [ "$(docker inspect -f '{{.State.Running}}' "$APP_NAME")" = "true" ]; then
                echo "Container is running. Install curl on the server for HTTP verification."
                exit 0
              fi
            fi

            sleep 2
          done

          echo "Deployment verification failed."
          docker logs --tail 100 "$APP_NAME"
          exit 1
          REMOTE

      - name: Disconnect OpenVPN
        if: always()
        shell: bash
        run: |
          if [ -f openvpn.pid ]; then
            sudo kill "$(sudo cat openvpn.pid)" || true
          fi
